name: best-sellers
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python top3.py
        env:
          TEBEX_SECRET: ${{ secrets.TEBEX_SECRET }}
      - name: Değiştiyse gönder
        run: |
          git config user.name "muto-bot"
          git config user.email "muto-bot@users.noreply.github.com"
          git add best.json
          git diff --cached --quiet || (git commit -m "best.json güncellendi" && git push)
